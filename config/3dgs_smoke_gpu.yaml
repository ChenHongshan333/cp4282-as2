# Starter configuration for 3dgs_trainer.py. Paths are resolved relative to *this file*, which is
# why they start with `../`. Run it from the repository root:
#
#     python 3dgs_trainer.py config/3dgs_training_gpu.yaml
#
# Every key not set here takes its default from TrainingConfig.DEFAULTS in
# shared/training_config.py; read that file for the full schema.

paths:
  data: ../data/lego
  output: ../outputs/smoke-sparse.png
  init_ply: ../data/lego/init.ply

runtime:
  arch: gpu
  seed: 7

model:
  width: 64
  height: 64
  capacity: 100000
  initial_splats: 1000
  background: white

training:
  iterations: 1

densification:
  interval: 100
  fraction: 0.2

sparse:
  enabled: true
  samples_per_tile: 256